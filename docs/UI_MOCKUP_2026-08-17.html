<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>약국 매장 관리 · 대시보드 리디자인 예시 · 2026-08-17</title>
<!--
  사용자 제공 UI 목업 · 2026-08-17 · 최종본 (모든 UI 적용 기준)
  · 참조 문서: docs/UI_MOCKUP_2026-08-17.html (이 파일)
  · 프레임워크 컴포넌트 매핑:
    - Sidebar (deep teal) · SideNav.tsx 업데이트 예정
    - Hero (gradient teal banner) · common/Hero.tsx 신규
    - IconButton (36x36 rounded-10) · common/IconButton.tsx 신규
    - SearchBar (pill-shaped) · common/SearchBar.tsx 신규
    - SectionLabel (dot + brand text) · common/SectionLabel.tsx (완료)
    - KpiCard (label + big value + trend) · common/KpiCard.tsx (mockup 톤 업데이트 예정)
    - MenuCard (icon tint box + stat chips) · LandingPage/MenuCard.tsx (완료)
    - MiniCard (inline icon + title/desc) · common/MiniCard.tsx 신규
    - Panel (surface + title + content) · common/Panel.tsx 신규
    - ActivityFeed · NoticeList · DonutChart · (별도 세션)
  · 컬러 토큰 · src/styles/tokens.ts 반영 예정:
    - --bg: #F5F7F7
    - --surface: #FFFFFF
    - --ink: #12201C · --ink-soft: #5B6B66
    - --line: #E3E9E7
    - --brand: #0E6B5C · --brand-deep: #0A4F44 · --brand-tint: #E7F3F0
    - --amber: #E88A3D · --amber-tint: #FDEEE0
    - --coral: #D9584F · --coral-tint: #FBE7E5
    - --sky: #3E7CB1 · --sky-tint: #E8F1F9

    - --shadow: 0 1px 2px rgba(18,32,28,0.04), 0 6px 20px -8px rgba(18,32,28,0.10)

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg: #F5F7F7;
    --surface: #FFFFFF;
    --ink: #12201C;
    --ink-soft: #5B6B66;
    --line: #E3E9E7;
    --brand: #0E6B5C;
    --brand-deep: #0A4F44;
    --brand-tint: #E7F3F0;
    --amber: #E88A3D;
    --amber-tint: #FDEEE0;
    --coral: #D9584F;
    --coral-tint: #FBE7E5;
    --sky: #3E7CB1;
    --sky-tint: #E8F1F9;
    --radius-pill: 999px;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(18,32,28,0.04), 0 6px 20px -8px rgba(18,32,28,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display:flex;
    min-height:100vh;
  }
  /* Sidebar */
  .sidebar{ width: 232px; flex-shrink:0; background: var(--brand-deep); color: #EAF3F0; padding: 22px 16px; display:flex; flex-direction:column; gap: 4px; }
  .brand{ display:flex; align-items:center; gap:10px; padding: 6px 8px 22px 8px; }
  .brand-mark{ width:34px;height:34px;border-radius:10px; background: linear-gradient(135deg, #43C6A0, #0E6B5C); display:flex;align-items:center;justify-content:center; position:relative; }
  .brand-mark::before{ content:""; width:14px;height:14px; background: #fff; border-radius: 7px 7px 0 7px; transform: rotate(45deg); }
  .brand-name{font-weight:700;font-size:15px;letter-spacing:-0.2px;}
  .brand-sub{font-size:11px;color:#9CC4BA;margin-top:1px;}
  .nav-group-label{ font-size:11px; color:#7FA79C; text-transform:uppercase; letter-spacing:0.06em; padding: 14px 10px 6px; font-weight:600; }
  .nav-item{ display:flex;align-items:center;gap:11px; padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:500; color:#CFE6DF; cursor:pointer; transition: background .15s ease, color .15s ease; }
  .nav-item i{width:16px; text-align:center; font-size:14px; opacity:.85;}
  .nav-item:hover{ background: rgba(255,255,255,0.06); color:#fff; }
  .nav-item.active{ background: rgba(255,255,255,0.12); color:#fff; }
  .nav-item.active i{ color: #6FE3C2; opacity:1; }
  .nav-badge{ margin-left:auto; background: var(--coral); color:#fff; font-size:10.5px; font-weight:700; padding: 1px 7px; border-radius: var(--radius-pill); }
  .sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,0.08); display:flex;align-items:center;gap:10px; }
  .avatar{ width:32px;height:32px;border-radius:50%; background:#43C6A0; display:flex;align-items:center;justify-content:center; font-size:12px;font-weight:700;color:#0A4F44; }
  .sidebar-foot .who{font-size:12.5px;font-weight:600;color:#EAF3F0;}
  .sidebar-foot .role{font-size:11px;color:#8FB6AC;}
  /* Main */
  .main{ flex:1; min-width:0; padding: 26px 34px 60px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .icon-btn{ width:36px;height:36px;border-radius:10px; background:var(--surface); border:1px solid var(--line); display:flex;align-items:center;justify-content:center; color:var(--ink-soft); font-size:14px; cursor:pointer; position:relative; }
  .icon-btn .dot{ position:absolute; top:7px; right:7px; width:7px;height:7px;border-radius:50%; background:var(--coral); border:1.5px solid var(--surface); }
  .search{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius: var(--radius-pill); padding: 11px 18px; margin-bottom: 26px; color: var(--ink-soft); font-size:13.5px; max-width: 460px; }
  .section-label{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color: var(--brand); margin: 4px 0 12px; }
  .section-label .pill-dot{ width:6px;height:6px;border-radius:50%;background:var(--brand); }
  .grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 30px; }
  .card{ background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 16px; box-shadow: var(--shadow); cursor:pointer; transition: transform .15s ease, box-shadow .15s ease; position:relative; display:flex; flex-direction:column; gap:10px; }
  .card:hover{ transform: translateY(-2px); box-shadow: 0 10px 26px -10px rgba(18,32,28,0.18); }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; }
  .card-icon{ width:38px;height:38px;border-radius:11px; display:flex;align-items:center;justify-content:center; font-size:16px; }
  .card-title{ font-size:14.5px; font-weight:700; margin:0; letter-spacing:-0.1px;}
  .card-desc{ font-size:12px; color: var(--ink-soft); line-height:1.5; margin:0;}
  .stat-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .stat-chip{ display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding: 3px 9px 3px 7px; border-radius: var(--radius-pill); }
  .c-teal .card-icon{ background:var(--brand-tint); color:var(--brand); }
  .c-sky .card-icon{ background:var(--sky-tint); color:var(--sky); }
  .c-amber .card-icon{ background:var(--amber-tint); color:var(--amber); }
  .c-coral .card-icon{ background:var(--coral-tint); color:var(--coral); }
  .chip-blue{ background:var(--sky-tint); color:var(--sky); }
  .chip-coral{ background:var(--coral-tint); color:var(--coral); }
  .chip-amber{ background:var(--amber-tint); color:#B4650F; }
  .chip-green{ background:var(--brand-tint); color:var(--brand); }
  .kpi-strip{ display:grid; grid-template-columns: repeat(4,1fr); gap:14px; margin-bottom:30px; }
  .kpi{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding:16px 18px; box-shadow: var(--shadow); }
  .kpi .label{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:8px;}
  .kpi .value{ font-size:23px; font-weight:800; letter-spacing:-0.5px; display:flex; align-items:baseline; gap:6px;}
  .kpi .value small{ font-size:12px; font-weight:700; }
  .up{ color: var(--brand); }
  .down{ color: var(--coral); }
  .grid-2{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
  .mini-card{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding:14px 16px; display:flex; align-items:center; gap:12px; box-shadow: var(--shadow); cursor:pointer; }
  .mini-card:hover{ border-color: var(--brand); }
  .mini-icon{ width:32px;height:32px;border-radius:9px; display:flex;align-items:center;justify-content:center; font-size:13.5px; flex-shrink:0; }
  .mini-title{ font-size:13px; font-weight:700; }
  .mini-desc{ font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .note{ margin-top: 34px; font-size:11.5px; color: var(--ink-soft); border-top: 1px dashed var(--line); padding-top: 14px; }
  /* Hero */
  .hero{ position:relative; overflow:hidden; border-radius: 20px; background: linear-gradient(120deg, var(--brand-deep) 0%, var(--brand) 62%, #21987F 100%); color:#fff; padding: 26px 30px; margin-bottom: 26px; display:flex; align-items:center; justify-content:space-between; }
  .hero-blob{ position:absolute; border-radius:50%; background: rgba(255,255,255,0.08); }
  .hero-blob.b1{ width:220px; height:220px; right:-60px; top:-90px; }
  .hero-blob.b2{ width:140px; height:140px; right:120px; bottom:-80px; background: rgba(255,255,255,0.06);}
  .hero-eyebrow{ font-size:11.5px; font-weight:700; color:#B9E7DA; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:8px;}
  .hero h1{ font-size:22px; font-weight:800; margin:0 0 6px; letter-spacing:-0.4px; position:relative; z-index:1;}
  .hero p{ font-size:12.5px; color:#CFEBE2; margin:0; position:relative; z-index:1;}
  .hero-actions{ display:flex; gap:10px; position:relative; z-index:1;}
  .hero-btn{ background:#fff; color:var(--brand-deep); font-weight:700; font-size:12.5px; padding:10px 18px; border-radius: var(--radius-pill); cursor:pointer; display:flex; align-items:center; gap:7px; box-shadow: 0 8px 18px -8px rgba(0,0,0,0.35); }
  .hero-btn.ghost{ background: rgba(255,255,255,0.14); color:#fff; box-shadow:none; border: 1px solid rgba(255,255,255,0.35); }
  .hero-caps{ position:relative; z-index:1; display:flex; align-items:center; gap:-6px; }
  .cap{ width:44px; height:20px; border-radius:10px; display:inline-block; box-shadow: 0 4px 10px -4px rgba(0,0,0,0.4); }
  /* Two column */
  .content-wrap{ display:flex; gap:22px; align-items:flex-start; }
  .main-col{ flex:1; min-width:0; }
  .right-col{ width: 268px; flex-shrink:0; display:flex; flex-direction:column; gap:16px; }
  .panel{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding: 16px 17px; box-shadow: var(--shadow); }
  .panel-title{ font-size:13px; font-weight:700; margin:0 0 12px; display:flex; align-items:center; justify-content:space-between;}
  .panel-title .more{ font-size:11px; color:var(--brand); font-weight:600; cursor:pointer; }
  .donut-wrap{ display:flex; align-items:center; gap:16px; }
  .donut{ width:88px; height:88px; border-radius:50%; flex-shrink:0; background: conic-gradient(var(--brand) 0% 46%, var(--sky) 46% 72%, var(--amber) 72% 90%, var(--coral) 90% 100%); position:relative; }
  .donut::after{ content:""; position:absolute; inset:14px; background:var(--surface); border-radius:50%; }
  .legend{ display:flex; flex-direction:column; gap:7px; }
  .legend-row{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-soft); }
  .legend-dot{ width:8px;height:8px;border-radius:50%; }
  .feed-item{ display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .feed-item:last-child{ border-bottom:none; padding-bottom:0; }
  .feed-dot{ width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; margin-top:1px; }
  .feed-text{ font-size:12px; line-height:1.5; }
  .feed-text b{ font-weight:700; }
  .feed-time{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .notice-item{ font-size:12px; padding:8px 0; border-bottom:1px dashed var(--line); display:flex; justify-content:space-between; gap:8px;}
  .notice-item:last-child{border-bottom:none;}
  .notice-tag{ font-size:10px; font-weight:700; color:var(--coral); flex-shrink:0; }
</style>
</head>
<body>
  <!-- 목업 HTML 원본 · 참조용 · 실제 페이지는 React 컴포넌트로 이식 -->
  <div style="padding:40px; text-align:center; color:#5B6B66;">
    <p><strong>UI 목업 참조 문서</strong></p>
    <p>이 파일은 사용자 제공 목업 원본 저장본입니다.<br>실제 UI 는 React 컴포넌트 (common/*, LandingPage/*) 로 이식됩니다.</p>
    <p>목업 렌더링을 보려면 · 이 파일을 브라우저에서 직접 열어주세요.</p>
  </div>
</body>
</html>
